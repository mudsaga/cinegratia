<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gratia | Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <!-- Biblioteca do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="theme-dark theme-orange" style="display: flex; align-items: center; justify-content: center; height: 100vh;">

    <div class="modal-content" style="max-width: 400px; margin: auto;">
        <div class="modal-header-row" style="border-bottom: none; padding-bottom: 0;">
            <h3 style="font-family: 'Playfair Display', serif; font-size: 28px; text-align: center; width: 100%;">Entrar no Gratia</h3>
        </div>
        <p style="color: var(--text-muted); font-size: 13px; text-align: center; margin-bottom: 10px;">Clube de Cinema</p>
        
        <div class="form-group">
            <label>E-mail</label>
            <input type="email" id="login-email" placeholder="seu@email.com">
        </div>
        <div class="form-group" style="margin-top: 15px;">
            <label>Senha</label>
            <input type="password" id="login-password" placeholder="Sua senha">
        </div>

        <div id="login-error" style="color: #ef4444; font-size: 12px; margin-top: 10px; display: none; text-align: center;"></div>

        <button class="btn-add-movie" id="btn-fazer-login" style="width: 100%; margin-top: 20px; padding: 12px;">Entrar</button>
    </div>

    <script>
        // Substitua pelas credenciais do seu projeto no Supabase
        const SUPABASE_URL = 'https://lszrmhtyzilemyybhxdl.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_aRoMe2EJHGVvmcPrTgfXcQ_fDNyiCnW';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.getElementById('btn-fazer-login').addEventListener('click', async () => {
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value.trim();
            const errorEl = document.getElementById('login-error');

            if (!email || !password) {
                errorEl.innerText = "Preencha o e-mail e a senha.";
                errorEl.style.display = 'block';
                return;
            }

            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                errorEl.innerText = "E-mail ou senha incorretos.";
                errorEl.style.display = 'block';
            } else {
                window.location.href = '../index.html';
            }
        });
    </script>
</body>
</html>
